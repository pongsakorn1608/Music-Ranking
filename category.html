<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Music Ranking - หมวดหมู่</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        .category {
            background-color: white;
            text-align: center;
            padding: 15px;
        }

        .category a {
            display: inline-block;
            padding: 10px 15px;
            margin: 5px;
            background-color: #eee;
            color: #333;
            border-radius: 5px;
        }

        .category a:hover {
            background-color: #222;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        #categoryTitle {
            margin-bottom: 25px;
        }

        .product-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .product {
            background-color: white;
            width: calc(50% - 10px);
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .product-image {
            height: 240px;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-content {
            padding: 20px;
        }

        .rank {
            display: inline-block;
            background-color: #f0a500;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
        }

        .category-name {
            color: #777;
            margin-top: 10px;
        }

        .price {
            color: #d35400;
            font-size: 20px;
            font-weight: bold;
        }

        .description {
            line-height: 1.6;
            color: #555;
        }

        .detail-button {
            display: block;
            background-color: #222;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 5px;
        }

        footer {
            margin-top: 40px;
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media screen and (max-width: 700px) {

            .product {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>🎵 Music Ranking</h1>

    <p id="subtitle">
        หมวดหมู่เครื่องดนตรี
    </p>

</header>


<div class="category">

    <a href="index.html">
        🏠 หน้าแรก
    </a>

    <a href="category.html?category=guitar">
        🎸 กีตาร์
    </a>

    <a href="category.html?category=piano">
        🎹 เปียโนและคีย์บอร์ด
    </a>

    <a href="category.html?category=drum">
        🥁 กลองและเพอร์คัชชัน
    </a>

    <a href="category.html?category=wind">
        🎷 เครื่องเป่า
    </a>

    <a href="category.html?category=studio">
        🎤 อุปกรณ์สตูดิโอ
    </a>

</div>


<div class="container">

    <h2 id="categoryTitle">
        กำลังโหลด...
    </h2>


    <div class="product-list"
         id="productList">

    </div>

</div>


<footer>

    <p>
        © 2026 Music Ranking
    </p>

</footer>


<script>

    /* -----------------------------
       ข้อมูลสินค้า
    ----------------------------- */

    var products = [

        {
            name: "Yamaha F310",
            category: "guitar",
            categoryName: "กีตาร์",
            price: "4,500 บาท",
            image: "https://images.unsplash.com/photo-1525201548942-d8732f6617a0?auto=format&fit=crop&w=800&q=80",
            description: "กีตาร์โปร่งสำหรับผู้เริ่มต้น เสียงดีและจับคอง่าย",
            link: "detail.html?product=yamaha-f310"
        },

        {
            name: "Casio CDP-S100",
            category: "piano",
            categoryName: "เปียโนและคีย์บอร์ด",
            price: "14,900 บาท",
            image: "https://images.unsplash.com/photo-1520523839897-bd0b52f945a0?auto=format&fit=crop&w=800&q=80",
            description: "เปียโนไฟฟ้าขนาดกะทัดรัด เหมาะสำหรับผู้เริ่มต้น",
            link: "detail.html?product=casio-cdp-s100"
        },

        {
            name: "Roland TD-1DMK",
            category: "drum",
            categoryName: "กลองและเพอร์คัชชัน",
            price: "28,500 บาท",
            image: "https://images.unsplash.com/photo-1519892300165-cb5542fb47c7?auto=format&fit=crop&w=800&q=80",
            description: "กลองไฟฟ้าสำหรับฝึกซ้อม ให้ความรู้สึกใกล้เคียงกลองจริง",
            link: "detail.html?product=roland-td-1dmk"
        },

        {
            name: "Audio-Technica AT2020",
            category: "studio",
            categoryName: "อุปกรณ์สตูดิโอ",
            price: "3,990 บาท",
            image: "https://images.unsplash.com/photo-1590602847861-f357a9332bbc?auto=format&fit=crop&w=800&q=80",
            description: "ไมโครโฟนสำหรับบันทึกเสียงและร้องเพลง",
            link: "detail.html?product=audio-technica-at2020"
        }

    ];


    /* -----------------------------
       อ่านหมวดหมู่จาก URL
    ----------------------------- */

    var urlParams =
        new URLSearchParams(window.location.search);

    var selectedCategory =
        urlParams.get("category");


    var categoryNames = {

        guitar: "🎸 กีตาร์",

        piano: "🎹 เปียโนและคีย์บอร์ด",

        drum: "🥁 กลองและเพอร์คัชชัน",

        wind: "🎷 เครื่องเป่า",

        studio: "🎤 อุปกรณ์สตูดิโอ"

    };


    document.getElementById("categoryTitle").innerText =
        "จัดอันดับ " +
        (categoryNames[selectedCategory] || "เครื่องดนตรี");


    document.getElementById("subtitle").innerText =
        "แนะนำเครื่องดนตรีในหมวด " +
        (categoryNames[selectedCategory] || "ทั้งหมด");


    /* -----------------------------
       แสดงสินค้า
    ----------------------------- */

    var productList =
        document.getElementById("productList");


    products.forEach(function(product) {

        if (product.category === selectedCategory) {

            productList.innerHTML += `

                <div class="product">

                    <div class="product-image">

                        <img
                            src="${product.image}"
                            alt="${product.name}">

                    </div>

                    <div class="product-content">

                        <span class="rank">
                            TOP
                        </span>

                        <div class="category-name">
                            ${product.categoryName}
                        </div>

                        <h2>
                            ${product.name}
                        </h2>

                        <div class="price">
                            ${product.price}
                        </div>

                        <p class="description">
                            ${product.description}
                        </p>

                        <a
                            href="${product.link}"
                            class="detail-button">

                            ดูรายละเอียด

                        </a>

                    </div>

                </div>

            `;

        }

    });

</script>


</body>

</html>
