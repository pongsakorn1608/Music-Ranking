<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หมวดหมู่ | Music Ranking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="nav-bar">
            <a class="brand" href="index.html">Music <span>Ranking</span></a>
            <nav aria-label="เมนูหลัก"><ul class="nav-links"><li><a href="index.html">หน้าหลัก</a></li><li><a href="team.html">รู้จักเรา</a></li></ul></nav>
        </div>
    </header>
    <main class="main-content">
        <nav class="category-nav" aria-label="หมวดหมู่เครื่องดนตรี">
            <a href="index.html">ทั้งหมด</a><a href="category.html?category=guitar">กีตาร์</a>
            <a href="category.html?category=piano">เปียโนและคีย์บอร์ด</a><a href="category.html?category=drum">กลอง</a>
            <a href="category.html?category=wind">เครื่องเป่า</a><a href="category.html?category=studio">เบสไฟฟ้า</a>
        </nav>
        <section class="page-container">
            <div class="section-heading"><div><p class="eyebrow">CATEGORY</p><h1 id="category-title">หมวดหมู่เครื่องดนตรี</h1></div></div>
            <div class="product-grid" id="product-list"></div>
        </section>
    </main>
    <footer class="site-footer"><p>© 2026 Music Ranking</p></footer>
    <script src="products.js"></script>
    <script>
        var names = { guitar: "กีตาร์", piano: "เปียโนและคีย์บอร์ด", drum: "กลองชุด", wind: "เครื่องเป่า", studio: "เบสไฟฟ้า" };
        var selected = new URLSearchParams(window.location.search).get("category");
        var title = document.getElementById("category-title");
        var list = document.getElementById("product-list");
        title.textContent = names[selected] || "หมวดหมู่เครื่องดนตรี";
        document.querySelectorAll(".category-nav a").forEach(function (link) {
            if (link.href.indexOf("category=" + selected) !== -1) link.classList.add("current");
        });
        var matching = Object.keys(musicProducts).filter(function (id) { return musicProducts[id].category === selected; });
        if (matching.length === 0) {
            list.innerHTML = '<div class="empty-state"><h2>ยังไม่มีสินค้าในหมวดหมู่นี้</h2><p>กลับไปดูรายการแนะนำทั้งหมดได้ที่หน้าหลัก</p><a class="button" href="index.html">กลับหน้าหลัก</a></div>';
        } else {
            matching.forEach(function (id) {
                var product = musicProducts[id];
                list.innerHTML += '<article class="product-card"><div class="product-image"><img src="' + product.image + '" alt="' + product.name + '"></div><div class="product-content"><p class="product-type">' + product.categoryName + '</p><h2>' + product.name + '</h2><p class="price">' + product.price + '</p><p class="product-description">' + product.description + '</p><a class="button button-block" href="detail.html?product=' + id + '">ดูรายละเอียด</a></div></article>';
            });
        }
    </script>
</body>
</html>
