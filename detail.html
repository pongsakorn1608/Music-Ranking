<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดสินค้า | Music Ranking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header"><div class="nav-bar">
        <a class="brand" href="index.html">Music <span>Ranking</span></a>
        <nav aria-label="เมนูหลัก"><ul class="nav-links"><li><a href="index.html">หน้าหลัก</a></li><li><a href="team.html">รู้จักเรา</a></li></ul></nav>
    </div></header>
    <main class="main-content"><div class="page-container">
        <p><a class="muted" href="index.html">← กลับหน้าหลัก</a></p>
        <section class="detail-layout" id="product-detail" aria-live="polite"></section>
    </div></main>
    <footer class="site-footer"><p>© 2026 Music Ranking</p></footer>
    <script src="products.js"></script>
    <script>
        var productId = new URLSearchParams(window.location.search).get("product");
        var product = musicProducts[productId];
        var detail = document.getElementById("product-detail");
        if (!product) {
            detail.innerHTML = '<div class="empty-state"><h1>ไม่พบสินค้าที่เลือก</h1><p>ลิงก์อาจไม่ถูกต้อง หรือสินค้านี้ยังไม่มีข้อมูล</p><a class="button" href="index.html">กลับหน้าหลัก</a></div>';
        } else {
            document.title = product.name + " | Music Ranking";
            detail.innerHTML = '<img class="detail-image" src="' + product.image + '" alt="' + product.name + '"><article class="detail-card"><p class="product-type">' + product.categoryName + '</p><h1>' + product.name + '</h1><p class="price">' + product.price + '</p><p class="product-description">' + product.description + '</p><table class="spec-table"><tr><th>ประเภท</th><td>' + product.type + '</td></tr><tr><th>เหมาะกับ</th><td>' + product.use + '</td></tr><tr><th>จุดเด่น</th><td>' + product.feature + '</td></tr></table><a class="button" href="category.html?category=' + product.category + '">ดูหมวดหมู่เดียวกัน</a></article>';
        }
    </script>
</body>
</html>
